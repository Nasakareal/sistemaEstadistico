openapi: 3.0.3
info:
  title: API privada SIERSE - Galvan
  version: 1.0.0
  description: >-
    Integracion servidor a servidor. Requiere HTTPS, certificado mTLS,
    IP autorizada y firma HMAC-SHA256 en cada solicitud.
servers:
  - url: https://seguridadvial-mich.com/api/integraciones/sierse/v1
security:
  - sierseClient: []
    sierseKeyId: []
    sierseTimestamp: []
    sierseNonce: []
    sierseSignature: []
paths:
  /estado:
    get:
      summary: Verifica autenticacion y capacidades
      responses:
        '200':
          description: Enlace correcto
        '401':
          description: Firma invalida
        '403':
          description: IP o certificado no autorizado
        '404':
          description: Integracion deshabilitada
  /buscar:
    get:
      summary: Busca exclusivamente vehiculos bajo custodia de Galvan
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [inventory, plate, vin, conduce_folio]
        - in: query
          name: value
          required: true
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Uno o mas vehiculos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSearchResponse'
        '404':
          description: No existe, no pertenece a Galvan o el intercambio esta deshabilitado
  /vehiculos:
    get:
      summary: Lista paginada de vehiculos bajo custodia de Galvan
      parameters:
        - in: query
          name: source
          required: true
          schema:
            type: string
            enum: [vehicle_registry, conduce_legalidad]
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: per_page
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: updated_since
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Lista paginada
  /vehiculos/{source}/{vehicleId}:
    get:
      summary: Obtiene un expediente autorizado
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Expediente del vehiculo
        '404':
          description: No encontrado o fuera del alcance de Galvan
  /vehiculos/{source}/{vehicleId}/fotos/{type}:
    get:
      summary: Descarga una foto autenticada del expediente
      description: >-
        El valor exacto de type se obtiene de data.photos[].download_path.
        Puede corresponder al vehiculo, inventario, servicio, Hecho, Actividad
        o Conduce con Legalidad. Cada descarga vuelve a comprobar que el
        vehiculo pertenece al alcance de Galvan.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/VehicleId'
        - in: path
          name: type
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]+$'
      responses:
        '200':
          description: Imagen binaria
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404':
          description: Foto no disponible o vehiculo no autorizado
  /vehiculos/{source}/{vehicleId}/eventos:
    post:
      summary: Recibe costos, estados, liberaciones o evidencias
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEvent'
      responses:
        '202':
          description: Evento procesado; consultar event.status (APPLIED, REVIEW_REQUIRED o RECEIVED)
        '200':
          description: Evento idempotente ya recibido con el mismo contenido
        '409':
          description: El identificador ya existe con contenido diferente
        '413':
          description: Cuerpo mayor a 60 MiB
        '422':
          description: Estructura, datos o archivo no validos
  /eventos/{externalEventId}:
    get:
      summary: Consulta el estado de un evento enviado por Galvan
      parameters:
        - in: path
          name: externalEventId
          required: true
          schema: {type: string, maxLength: 120}
      responses:
        '200':
          description: Estado del evento
        '404':
          description: Evento no encontrado para este cliente
components:
  securitySchemes:
    sierseClient:
      type: apiKey
      in: header
      name: X-SIERSE-Client
    sierseTimestamp:
      type: apiKey
      in: header
      name: X-SIERSE-Timestamp
    sierseKeyId:
      type: apiKey
      in: header
      name: X-SIERSE-Key-Id
    sierseNonce:
      type: apiKey
      in: header
      name: X-SIERSE-Nonce
    sierseSignature:
      type: apiKey
      in: header
      name: X-SIERSE-Signature
  parameters:
    Source:
      in: path
      name: source
      required: true
      schema:
        type: string
        enum: [vehicle_registry, conduce_legalidad]
    VehicleId:
      in: path
      name: vehicleId
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    VehicleSearchResponse:
      type: object
      properties:
        ok: {type: boolean}
        query: {type: object}
        data:
          type: array
          items: {$ref: '#/components/schemas/Vehicle'}
    Vehicle:
      type: object
      description: Lista positiva; nunca incluye conductores, telefonos o domicilios.
      properties:
        source: {type: string}
        id: {type: integer}
        inventory_number: {type: string, nullable: true}
        conduce_folio: {type: string, nullable: true}
        make: {type: string, nullable: true}
        line: {type: string, nullable: true}
        model: {type: string, nullable: true}
        type: {type: string, nullable: true}
        color: {type: string, nullable: true}
        plate: {type: string, nullable: true}
        plate_state: {type: string, nullable: true}
        vin: {type: string, nullable: true}
        yard: {type: string, nullable: true}
        available_photos:
          type: array
          items: {type: string}
        photos:
          type: array
          description: Galeria autorizada sin rutas internas ni URLs publicas permanentes.
          items:
            $ref: '#/components/schemas/PhotoReference'
    PhotoReference:
      type: object
      required: [type, label, download_path, authentication_required]
      properties:
        type:
          type: string
          enum: [vehicle, inventory, service, hecho, activity, conduce_legalidad]
        label: {type: string}
        download_path:
          type: string
          description: Ruta que debe solicitarse con el mismo certificado mTLS y firma HMAC.
        authentication_required: {type: boolean, enum: [true]}
    InboundEvent:
      type: object
      required: [external_event_id, event_type, data]
      properties:
        external_event_id:
          type: string
          maxLength: 120
          pattern: '^[A-Za-z0-9._:-]+$'
        event_type:
          type: string
          enum: [service_update, cost_update, release_update, evidence_update, other]
        schema_version: {type: string, default: '1.0'}
        data:
          oneOf:
            - $ref: '#/components/schemas/ServiceUpdate'
            - $ref: '#/components/schemas/CostUpdate'
            - $ref: '#/components/schemas/ReleaseUpdate'
            - $ref: '#/components/schemas/EvidenceUpdate'
    ServiceUpdate:
      type: object
      properties:
        sierse_folio: {type: string, maxLength: 120}
        requested_at: {type: string, format: date-time}
        arrived_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        origin: {type: string, maxLength: 255}
        destination: {type: string, maxLength: 255}
        operator_name: {type: string, maxLength: 255}
        tow_unit: {type: string, maxLength: 120}
        kilometers: {type: number, minimum: 0}
        performed_maneuvers: {type: boolean}
        maneuvers_description: {type: string, maxLength: 2000}
        notes: {type: string, maxLength: 2000}
    CostUpdate:
      type: object
      required: [total_amount]
      properties:
        total_amount: {type: number, minimum: 0}
        currency: {type: string, enum: [MXN], default: MXN}
        payment_method: {type: string, maxLength: 40}
        payment_status: {type: string, enum: [PENDING, PARTIAL, PAID, CANCELLED]}
        invoice_reference: {type: string, maxLength: 120}
        breakdown:
          type: array
          items:
            type: object
            required: [concept, amount]
            properties:
              concept: {type: string, maxLength: 120}
              amount: {type: number, minimum: 0}
        notes: {type: string, maxLength: 2000}
    ReleaseUpdate:
      type: object
      required: [released]
      properties:
        released: {type: boolean}
        released_at: {type: string, format: date-time}
        sierse_folio: {type: string, maxLength: 120}
        delivery_condition: {type: string, enum: [CONFORME_INVENTARIO, CON_OBSERVACIONES]}
        notes: {type: string, maxLength: 2000}
        documents: {$ref: '#/components/schemas/Documents'}
    EvidenceUpdate:
      type: object
      required: [documents]
      properties:
        documents: {$ref: '#/components/schemas/Documents'}
        notes: {type: string, maxLength: 2000}
    Documents:
      type: object
      description: >-
        Se permiten memory_description (15 MiB), payment_receipt (10 MiB),
        release_document (10 MiB) y delivery_photo (5 MiB). El servidor valida
        el MIME real; PDF, JPEG, PNG o WebP.
      properties:
        memory_description: {$ref: '#/components/schemas/Base64Document'}
        payment_receipt: {$ref: '#/components/schemas/Base64Document'}
        release_document: {$ref: '#/components/schemas/Base64Document'}
        delivery_photo: {$ref: '#/components/schemas/Base64Document'}
      additionalProperties: false
    Base64Document:
      type: object
      required: [filename, mime, content_base64]
      properties:
        filename: {type: string, maxLength: 180}
        mime: {type: string, enum: [application/pdf, image/jpeg, image/png, image/webp]}
        content_base64: {type: string, format: byte}
